openapi: 3.0.3
info:
  title: PayBridge API
  description: Payment Integration Platform & Autonomous Revenue Recovery API
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Policy:
      type: object
      properties:
        id:
          type: integer
        merchantId:
          type: integer
        version:
          type: integer
        isActive:
          type: boolean
        autonomyTier:
          type: string
          enum: [T0, T1, T2, T3, T4]
        maxRetries:
          type: integer
        maxContactsPerCustomerPerWeek:
          type: integer
        maxIncentivePercent:
          type: number
        dailyBudgetMinorUnits:
          type: integer
        quietHoursStart:
          type: string
        quietHoursEnd:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProposedAction:
      type: object
      required:
        - actionType
      properties:
        actionType:
          type: string
          enum: [RETRY_PAYMENT, CUSTOMER_OUTREACH, OFFER_INCENTIVE, REQUEST_PAYMENT_METHOD, ESCALATE_TO_SUPPORT, CLOSE_CASE]
        caseRef:
          type: string
        orderRef:
          type: string
        costMinorUnits:
          type: integer
        incentivePercent:
          type: number
        scheduledAt:
          type: string
          format: date-time
        metadata:
          type: object
    EvaluationContext:
      type: object
      properties:
        evaluationTime:
          type: string
          format: date-time
        globalAutonomyTier:
          type: string
          enum: [T0, T1, T2, T3, T4]
        currentRetryCount:
          type: integer
        contactsThisWeek:
          type: integer
        dailySpentMinorUnits:
          type: integer
        isTerminalFailure:
          type: boolean
        failureCategory:
          type: string
        requiresHumanReview:
          type: boolean
        correlationId:
          type: string
    PolicyEvaluationResult:
      type: object
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED, REQUIRES_HUMAN]
        reasonCode:
          type: string
        ruleId:
          type: string
        message:
          type: string
        policyId:
          type: integer
        policyVersion:
          type: integer
        evaluatedTier:
          type: string
          enum: [T0, T1, T2, T3, T4]
        evaluatedAt:
          type: string
          format: date-time
        proposedAction:
          $ref: '#/components/schemas/ProposedAction'
        correlationId:
          type: string
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
  /payments/orders:
    post:
      summary: Create a new payment order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - currency
                - customerEmail
              properties:
                amount:
                  type: number
                currency:
                  type: string
                customerEmail:
                  type: string
      responses:
        '201':
          description: Order created
  /payments/orders/{orderId}/pay:
    post:
      summary: Process a payment for an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentMethod
              properties:
                paymentMethod:
                  type: string
      responses:
        '202':
          description: Payment processing accepted
  /merchants/policies:
    get:
      summary: List all policies for the authenticated merchant
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
    post:
      summary: Create a new versioned policy configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                autonomyTier:
                  type: string
                  enum: [T0, T1, T2, T3, T4]
                maxRetries:
                  type: integer
                maxContactsPerCustomerPerWeek:
                  type: integer
                maxIncentivePercent:
                  type: number
                dailyBudgetMinorUnits:
                  type: integer
                quietHoursStart:
                  type: string
                quietHoursEnd:
                  type: string
                timezone:
                  type: string
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
  /merchants/policies/active:
    get:
      summary: Get current active policy for the authenticated merchant
      responses:
        '200':
          description: Active policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: No active policy found
  /merchants/policies/{id}:
    get:
      summary: Get policy by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
    put:
      summary: Update existing policy configuration
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated policy
  /merchants/policies/{id}/activate:
    patch:
      summary: Activate policy (atomically deactivating previous active policy)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Activated policy
  /merchants/policies/{id}/deactivate:
    patch:
      summary: Deactivate policy
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deactivated policy
  /merchants/policies/evaluate:
    post:
      summary: Deterministically evaluate a proposed recovery action against merchant active policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  $ref: '#/components/schemas/ProposedAction'
                context:
                  $ref: '#/components/schemas/EvaluationContext'
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEvaluationResult'
  /merchants/recovery/ledger:
    get:
      summary: Retrieve Recoverable Revenue & Leakage Ledger for the authenticated merchant
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
        - in: query
          name: currency
          schema:
            type: string
      responses:
        '200':
          description: Recoverable revenue ledger with exact reconciliation breakdown
  /merchants/recovery/queue:
    get:
      summary: Retrieve prioritized recovery case queue with fair scheduling
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: maxPerMerchant
          schema:
            type: integer
      responses:
        '200':
          description: Prioritized recovery cases with deterministic scores
  /merchants/recovery/metrics:
    get:
      summary: Retrieve queue depth, oldest case age, and shed volume metrics
      responses:
        '200':
          description: Queue operational metrics
  /merchants/recovery/shed:
    post:
      summary: Explicitly execute load shedding when queue depth exceeds capacity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capacityLimit
              properties:
                capacityLimit:
                  type: integer
      responses:
        '200':
          description: Shed cases result with audit count
  /recovery/cases:
    get:
      summary: List recovery cases for authenticated merchant
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated recovery cases
  /recovery/queue:
    get:
      summary: Retrieve prioritized triage queue
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: maxPerMerchant
          schema:
            type: integer
      responses:
        '200':
          description: Prioritized queue
  /recovery/cases/{idOrRef}:
    get:
      summary: Get case by ID or ULID reference
      parameters:
        - in: path
          name: idOrRef
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recovery case details
        '404':
          description: Case not found
  /recovery/cases/{caseId}/timeline:
    get:
      summary: Get chronological case event history
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Case event timeline
  /recovery/cases/{caseId}/traces:
    get:
      summary: Get agent reasoning traces for case
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Agent reasoning traces
  /recovery/cases/{caseId}/actions:
    post:
      summary: Execute operator action on case (approve, reject, close)
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - reason
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT, CLOSE]
                reason:
                  type: string
                payload:
                  type: object
      responses:
        '200':
          description: Updated recovery case after action execution
        '400':
          description: Invalid transition or validation error
        '404':
          description: Case not found
  /audit/cases/{idOrRef}/export:
    get:
      summary: Export certified case audit trail as CSV or JSON for compliance (AUD-006 / RDB-002)
      parameters:
        - in: path
          name: idOrRef
          required: true
          schema:
            type: string
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - in: query
          name: includeTraces
          schema:
            type: string
            enum: ['true', 'false']
            default: 'true'
      responses:
        '200':
          description: Certified audit trail export file with X-Audit-Signature header
          headers:
            X-Audit-Signature:
              schema:
                type: string
              description: Cryptographic SHA-256 integrity checksum over canonical export payload
            X-Export-Id:
              schema:
                type: string
              description: Unique export identifier
        '400':
          description: Invalid query parameter
        '401':
          description: Unauthorized
        '404':
          description: Recovery case not found or cross-tenant access prohibited
