services:
  mysql:
    image: mysql:8.4
    container_name: paybridge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: paybridge
      MYSQL_USER: paybridge
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root_change_me
    ports:
      - "3306:3306"
    volumes:
      - paybridge-mysql-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paybridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: paybridge-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  paybridge-api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: paybridge-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_USER=paybridge
      - MYSQL_PASSWORD=change_me
      - MYSQL_DATABASE=paybridge
      - JWT_ACCESS_SECRET=development_access_secret_change_in_production
      - JWT_REFRESH_SECRET=development_refresh_secret_change_in_production
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paybridge-payment-worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: paybridge-payment-worker
    command: ["npm", "run", "start:payment-worker", "--workspace", "server"]
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_USER=paybridge
      - MYSQL_PASSWORD=change_me
      - MYSQL_DATABASE=paybridge
      - JWT_ACCESS_SECRET=development_access_secret_change_in_production
      - JWT_REFRESH_SECRET=development_refresh_secret_change_in_production
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paybridge-dlq-worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: paybridge-dlq-worker
    command: ["npm", "run", "start:dlq-worker", "--workspace", "server"]
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_USER=paybridge
      - MYSQL_PASSWORD=change_me
      - MYSQL_DATABASE=paybridge
      - JWT_ACCESS_SECRET=development_access_secret_change_in_production
      - JWT_REFRESH_SECRET=development_refresh_secret_change_in_production
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paybridge-webhook-worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: paybridge-webhook-worker
    command: ["npm", "run", "start:webhook-worker", "--workspace", "server"]
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_USER=paybridge
      - MYSQL_PASSWORD=change_me
      - MYSQL_DATABASE=paybridge
      - JWT_ACCESS_SECRET=development_access_secret_change_in_production
      - JWT_REFRESH_SECRET=development_refresh_secret_change_in_production
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paybridge-action-worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: paybridge-action-worker
    restart: unless-stopped
    command: ["npm", "run", "start:action-worker", "--workspace", "server"]
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_USER=paybridge
      - MYSQL_PASSWORD=change_me
      - MYSQL_DATABASE=paybridge
      - JWT_ACCESS_SECRET=development_access_secret_change_in_production
      - JWT_REFRESH_SECRET=development_refresh_secret_change_in_production
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paybridge-recovery-worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: paybridge-recovery-worker
    restart: unless-stopped
    command: ["npm", "run", "start:recovery-worker", "--workspace", "server"]
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_USER=paybridge
      - MYSQL_PASSWORD=change_me
      - MYSQL_DATABASE=paybridge
      - JWT_ACCESS_SECRET=development_access_secret_change_in_production
      - JWT_REFRESH_SECRET=development_refresh_secret_change_in_production
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paybridge-client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    container_name: paybridge-client
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: paybridge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: paybridge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus

volumes:
  paybridge-mysql-data:
