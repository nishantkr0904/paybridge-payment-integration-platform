name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: paybridge
          MYSQL_USER: paybridge
          MYSQL_PASSWORD: change_me
          MYSQL_ROOT_PASSWORD: root_change_me
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      matrix:
        node-version: [20.x]

    env:
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: paybridge
      MYSQL_USER: paybridge
      MYSQL_PASSWORD: change_me
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_pipeline_32_chars
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_pipeline_32_chars

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linting (Server)
      run: npm run lint --workspace server

    - name: Run Linting (Client)
      run: npm run lint --workspace client

    - name: Build Server
      run: npm run build --workspace server

    - name: Build Client
      run: npm run build --workspace client

    - name: Run Database Migrations
      run: npm run db:migrate --workspace server

    - name: Run Tests (Server)
      run: npm run test --workspace server

    - name: Run Tests (Client)
      run: npm run test --workspace client
